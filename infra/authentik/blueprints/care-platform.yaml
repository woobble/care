version: 1
metadata:
  name: Care Platform OIDC
  labels:
    blueprints.goauthentik.io/description: Local OIDC provider for the Care Platform web app
entries:
  - model: authentik_providers_oauth2.scopemapping
    id: care-platform-email
    identifiers:
      name: Care Platform OpenID email
    attrs:
      name: Care Platform OpenID email
      scope_name: email
      description: Email address and administrator-verified status
      expression: |
        return {
            "email": request.user.email,
            "email_verified": request.user.attributes.get("care_email_verified", False) is True,
        }
  - model: authentik_providers_oauth2.oauth2provider
    id: care-platform-provider
    identifiers:
      name: Care Platform
    attrs:
      client_id: care-platform
      client_secret: !Env OIDC_CLIENT_SECRET
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, "authentik default OAuth Mapping: OpenID 'openid'"],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, "authentik default OAuth Mapping: OpenID 'profile'"],
          ]
        - !KeyOf care-platform-email
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, "authentik default OAuth Mapping: OpenID 'offline_access'"],
          ]
      sub_mode: user_uuid
      jwt_algorithm: RS256
      include_claims_in_id_token: true
      redirect_uris:
        - matching_mode: strict
          url: !Env OIDC_REDIRECT_URI
  - model: authentik_core.application
    identifiers:
      slug: care-platform
    attrs:
      name: Care Platform
      provider: !KeyOf care-platform-provider
      meta_launch_url: !Env WEB_ORIGIN
