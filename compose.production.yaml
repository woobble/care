name: care-platform-prod

services:
  postgres:
    image: ghcr.io/woobble/care-platform:postgres-sha-14d7a0f117c82b8e7e5141317f89de6e48c205e3-run-39334177170-attempt-1@sha256:3422b622083c7a9184544f91cd9e5504e7dd92d6deb9016a5bf3aee584986ae3
    build: !reset null
    ports: !override []
    restart: unless-stopped
    networks: !override [care-private]

  redis:
    ports: !override []
    restart: unless-stopped
    networks: !override [care-private]

  authentik-server:
    image: ghcr.io/woobble/care-platform:authentik-sha-14d7a0f117c82b8e7e5141317f89de6e48c205e3-run-39334177170-attempt-1@sha256:dc61f3ecb29f8a5fc1db3899f10069f17e2ef1078699684a0ae01dd4473d600d
    build: !reset null
    environment: !override
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env.production}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: care_owner
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_WEB__BASE_URL: ${AUTHENTIK_PUBLIC_URL:?Set AUTHENTIK_PUBLIC_URL in .env.production}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?Set AUTHENTIK_BOOTSTRAP_PASSWORD in .env.production}
      AUTHENTIK_EMAIL__HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      AUTHENTIK_EMAIL__PORT: ${SMTP_PORT:-587}
      AUTHENTIK_EMAIL__USE_TLS: 'true'
      AUTHENTIK_EMAIL__USE_SSL: 'false'
      AUTHENTIK_EMAIL__FROM: ${SMTP_FROM:?Set SMTP_FROM in .env.production}
      AUTHENTIK_EMAIL__USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env.production}
      AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env.production}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in .env.production}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Set OIDC_REDIRECT_URI in .env.production}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env.production}
    volumes: !override
      - ./infra/authentik/blueprints/care-platform.yaml:/blueprints/custom/care-platform.yaml:ro
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: !override []
    restart: unless-stopped
    networks: !override [care-private, care-edge]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, ak, healthcheck]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  authentik-worker:
    image: ghcr.io/woobble/care-platform:authentik-sha-14d7a0f117c82b8e7e5141317f89de6e48c205e3-run-39334177170-attempt-1@sha256:dc61f3ecb29f8a5fc1db3899f10069f17e2ef1078699684a0ae01dd4473d600d
    build: !reset null
    environment: !override
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env.production}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: care_owner
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_WEB__BASE_URL: ${AUTHENTIK_PUBLIC_URL:?Set AUTHENTIK_PUBLIC_URL in .env.production}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?Set AUTHENTIK_BOOTSTRAP_PASSWORD in .env.production}
      AUTHENTIK_EMAIL__HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      AUTHENTIK_EMAIL__PORT: ${SMTP_PORT:-587}
      AUTHENTIK_EMAIL__USE_TLS: 'true'
      AUTHENTIK_EMAIL__USE_SSL: 'false'
      AUTHENTIK_EMAIL__FROM: ${SMTP_FROM:?Set SMTP_FROM in .env.production}
      AUTHENTIK_EMAIL__USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env.production}
      AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env.production}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in .env.production}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Set OIDC_REDIRECT_URI in .env.production}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env.production}
    volumes: !override
      - ./infra/authentik/blueprints/care-platform.yaml:/blueprints/custom/care-platform.yaml:ro
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: !override [care-private]
    security_opt: [no-new-privileges:true]

  seaweedfs:
    image: ghcr.io/woobble/care-platform:seaweedfs-sha-14d7a0f117c82b8e7e5141317f89de6e48c205e3-run-39334177170-attempt-1@sha256:ce675b90de4fde061ff91d2693c6692dc3e0ba730caa39209d9b1d70caa20cee
    build: !reset null
    command:
      - server
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.config=/run/secrets/seaweedfs_s3
      - -s3.port=8333
    ports: !override []
    configs: !override []
    secrets: [seaweedfs_s3]
    restart: unless-stopped
    networks: !override [care-private]

  seaweedfs-init:
    profiles: !override []
    image: ghcr.io/woobble/care-platform:aws-cli-sha-14d7a0f117c82b8e7e5141317f89de6e48c205e3-run-39334177170-attempt-1@sha256:60854f744c70bbe8f1fd51f2e9a51279faf6d0a2b7c49db1dbfafd2eeffba255
    build: !reset null
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - >-
        export AWS_ACCESS_KEY_ID="$$(cat "$${S3_ACCESS_KEY_FILE}")";
        export AWS_SECRET_ACCESS_KEY="$$(cat "$${S3_SECRET_KEY_FILE}")";
        until aws s3api list-buckets --endpoint-url "$${S3_ENDPOINT}" >/dev/null 2>&1; do sleep 1; done;
        if ! aws s3api head-bucket --bucket "$${S3_BUCKET}" --endpoint-url "$${S3_ENDPOINT}" >/dev/null 2>&1; then
          aws s3api create-bucket --bucket "$${S3_BUCKET}" --endpoint-url "$${S3_ENDPOINT}";
        fi
    environment: !override
      AWS_DEFAULT_REGION: ${S3_REGION:-eu-central-1}
      AWS_EC2_METADATA_DISABLED: 'true'
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env.production}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_init_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_init_secret_key
    secrets: [s3_init_access_key, s3_init_secret_key]
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: 'no'
    networks: !override [care-private]

  mailpit:
    profiles: !override [development]
    ports: !override []

  otel-collector:
    profiles: !override [observability]
    ports: !override []
    networks: !override [care-private]

  prometheus:
    image: ghcr.io/woobble/care-platform:prometheus-sha-14d7a0f117c82b8e7e5141317f89de6e48c205e3-run-39334177170-attempt-1@sha256:092f1af44d51073f39f91a64d6f3dd235db2a851f2a666458daadea92082b636
    build: !reset null
    profiles: !override [observability]
    ports: !override ['127.0.0.1:9090:9090']
    networks: !override [care-private]
    volumes: !override
      - ./infra/observability/prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.production.yml:/etc/prometheus/alerts.production.yml:ro
      - care-prometheus:/prometheus

  grafana:
    image: ghcr.io/woobble/care-platform:grafana-sha-14d7a0f117c82b8e7e5141317f89de6e48c205e3-run-39334177170-attempt-1@sha256:6bf6748f80ff90e975b91df8a0d4e5d60d1eb758d371f5602ef9b21ffae5be52
    build: !reset null
    profiles: !override [observability]
    ports: !override ['127.0.0.1:3002:3000']
    networks: !override [care-private]
    environment: !override
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.production}

  migrate:
    image: ghcr.io/woobble/care-platform:migrate-sha-14d7a0f117c82b8e7e5141317f89de6e48c205e3-run-39334177170-attempt-1@sha256:47d501ca690ef908b2f4891a859ba7bcdf2bf1768898dfb0866b168ada74d6f9
    build: !reset null
    command: [bun, apps/api/dist/migrate.js]
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets: [migration_database_url]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [care-private]

  api:
    image: ghcr.io/woobble/care-platform:api-sha-14d7a0f117c82b8e7e5141317f89de6e48c205e3-run-39334177170-attempt-1@sha256:9eb23d4b23bdfa840144399f3241d367f07c658f933444199c4021edd77fe30b
    build: !reset null
    environment: !override
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/care_database_url
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in .env.production}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in .env.production}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env.production}
      API_PUBLIC_ORIGIN: ${API_PUBLIC_ORIGIN:?Set API_PUBLIC_ORIGIN in .env.production}
      PORT: '3001'
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      SCHEDULE_GENERATION_HORIZON_DAYS: ${SCHEDULE_GENERATION_HORIZON_DAYS:-28}
      ROUTING_OSRM_URL: ${ROUTING_OSRM_URL:-}
      ROUTING_OSRM_PROBE_FROM: ${ROUTING_OSRM_PROBE_FROM:-}
      ROUTING_OSRM_PROBE_TO: ${ROUTING_OSRM_PROBE_TO:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env.production}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets: [care_database_url, s3_access_key, s3_secret_key]
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    expose: ['3002']
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:3001/health/ready'); process.exit(r.ok ? 0 : 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [care-private, care-edge]

  worker:
    image: ghcr.io/woobble/care-platform:worker-sha-14d7a0f117c82b8e7e5141317f89de6e48c205e3-run-39334177170-attempt-1@sha256:430eec8a7cc93f9b077b922bf03793525759fc038b0d3cd5b3f83c42333b04e5
    build: !reset null
    environment: !override
      NODE_ENV: production
      WORKER_DATABASE_URL_FILE: /run/secrets/worker_database_url
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    secrets: [worker_database_url]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    expose: ['3002', '3003']
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:3002/health/ready'); process.exit(r.ok ? 0 : 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [care-private]

  web:
    image: ghcr.io/woobble/care-platform:web-sha-14d7a0f117c82b8e7e5141317f89de6e48c205e3-run-39334177170-attempt-1@sha256:a15c7b70905960d1f09b0ce5868db99cd9b29701339212826a6a25a4bdf740f5
    build: !reset null
    environment: !override
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/care_database_url
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in .env.production}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in .env.production}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in .env.production}
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      API_INTERNAL_URL: http://api:3001
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env.production}
    secrets: [care_database_url, auth_secret]
    depends_on:
      api:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:3000'); process.exit(r.status < 500 ? 0 : 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [care-private, care-edge]

  osrm:
    image: ghcr.io/woobble/care-platform:osrm-sha-14d7a0f117c82b8e7e5141317f89de6e48c205e3-run-39334177170-attempt-1@sha256:63444cd3a5cc30d407adae219de8659b70f420bd22910867719c1b02b759b065
    build: !reset null
    ports: !override []
    entrypoint: [/usr/local/bin/care-osrm-launcher]
    command: !reset []
    volumes: !override
      - ./data/osrm:/data:ro
    healthcheck:
      test: [CMD, /usr/local/bin/care-osrm-launcher, healthcheck]
    networks: !override [care-private]

  caddy:
    image: ghcr.io/woobble/care-platform:caddy-sha-14d7a0f117c82b8e7e5141317f89de6e48c205e3-run-39334177170-attempt-1@sha256:274c6f6d0bdf84e367b0d6a3e24623b64d05f368726e9c077bae1caa52243d5e
    build: !reset null
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in .env.production}
      WEB_HOST: ${WEB_HOST:?Set WEB_HOST in .env.production}
      API_HOST: ${API_HOST:?Set API_HOST in .env.production}
      AUTHENTIK_HOST: ${AUTHENTIK_HOST:?Set AUTHENTIK_HOST in .env.production}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - care-caddy-data:/data
      - care-caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      care-edge:
        aliases:
          - ${AUTHENTIK_HOST:?Set AUTHENTIK_HOST in .env.production}

  operator:
    image: ghcr.io/woobble/care-platform:operator-sha-14d7a0f117c82b8e7e5141317f89de6e48c205e3-run-39334177170-attempt-1@sha256:551e5396dae11cfeae13fda1d552c5151e7ed886f8095bb945b8888b8956f41d
    build: !reset null
    command: [bun, apps/api/dist/ops/cli.js]
    environment: !override
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/care_database_url
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      WORKER_DATABASE_URL_FILE: /run/secrets/worker_database_url
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in .env.production}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in .env.production}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in .env.production}
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env.production}
      API_INTERNAL_URL: http://api:3001
      API_PUBLIC_ORIGIN: ${API_PUBLIC_ORIGIN:?Set API_PUBLIC_ORIGIN in .env.production}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env.production}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      WEB_HOST: ${WEB_HOST:?Set WEB_HOST in .env.production}
      API_HOST: ${API_HOST:?Set API_HOST in .env.production}
      AUTHENTIK_HOST: ${AUTHENTIK_HOST:?Set AUTHENTIK_HOST in .env.production}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?Set API_PUBLIC_URL in .env.production}
      AUTHENTIK_PUBLIC_URL: ${AUTHENTIK_PUBLIC_URL:?Set AUTHENTIK_PUBLIC_URL in .env.production}
      AUTHENTIK_WEB__BASE_URL: ${AUTHENTIK_WEB__BASE_URL:?Set AUTHENTIK_WEB__BASE_URL in .env.production}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Set OIDC_REDIRECT_URI in .env.production}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      CARE_APP_PASSWORD: ${CARE_APP_PASSWORD:?Set CARE_APP_PASSWORD in .env.production}
      CARE_WORKER_PASSWORD: ${CARE_WORKER_PASSWORD:?Set CARE_WORKER_PASSWORD in .env.production}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env.production}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?Set AUTHENTIK_BOOTSTRAP_PASSWORD in .env.production}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env.production}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env.production}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env.production}
      S3_INIT_ACCESS_KEY_FILE: /run/secrets/s3_init_access_key
      S3_INIT_SECRET_KEY_FILE: /run/secrets/s3_init_secret_key
      SEAWEEDFS_S3_CONFIG_FILE: /run/secrets/seaweedfs_s3
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      OPERATOR_SECRETS_DIR: /run/operator-secrets
    secrets:
      - care_database_url
      - migration_database_url
      - worker_database_url
      - auth_secret
      - s3_access_key
      - s3_secret_key
      - seaweedfs_s3
      - s3_init_access_key
      - s3_init_secret_key
    volumes:
      - ${BACKUP_DIR:?Set BACKUP_DIR in .env.production}:/backups
      - ${OPERATOR_SECRETS_DIR:-./secrets}:/run/operator-secrets:ro
    profiles: [operations]
    networks: [care-private, care-edge]

secrets:
  care_database_url:
    file: ${DATABASE_URL_FILE:?Set DATABASE_URL_FILE to a restricted secret file}
  migration_database_url:
    file: ${MIGRATION_DATABASE_URL_FILE:?Set MIGRATION_DATABASE_URL_FILE to a restricted secret file}
  worker_database_url:
    file: ${WORKER_DATABASE_URL_FILE:?Set WORKER_DATABASE_URL_FILE to a restricted secret file}
  auth_secret:
    file: ${AUTH_SECRET_FILE:?Set AUTH_SECRET_FILE to a restricted secret file}
  s3_access_key:
    file: ${S3_ACCESS_KEY_FILE:?Set S3_ACCESS_KEY_FILE to a restricted secret file}
  s3_secret_key:
    file: ${S3_SECRET_KEY_FILE:?Set S3_SECRET_KEY_FILE to a restricted secret file}
  seaweedfs_s3:
    file: ${SEAWEEDFS_S3_CONFIG_FILE:?Set SEAWEEDFS_S3_CONFIG_FILE to a restricted secret file}
  s3_init_access_key:
    file: ${S3_INIT_ACCESS_KEY_FILE:?Set S3_INIT_ACCESS_KEY_FILE to a restricted secret file}
  s3_init_secret_key:
    file: ${S3_INIT_SECRET_KEY_FILE:?Set S3_INIT_SECRET_KEY_FILE to a restricted secret file}

networks:
  care-private:
    internal: true
  care-edge:
    driver: bridge

volumes:
  care-caddy-data:
  care-caddy-config:
