name: care-platform

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: care_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-care_owner_dev_only}
      POSTGRES_DB: care
      CARE_APP_PASSWORD: ${CARE_APP_PASSWORD:-care_dev_only}
      CARE_WORKER_PASSWORD: ${CARE_WORKER_PASSWORD:-care_worker_dev_only}
    ports:
      - '5432:5432'
    volumes:
      - care-postgres:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - care-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.3
    command: server
    environment: &authentik-environment
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-local-authentik-secret-replace-before-deployment}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: care_owner
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:-care_owner_dev_only}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-local-admin-password-replace-before-deployment}
      AUTHENTIK_EMAIL__HOST: mailpit
      AUTHENTIK_EMAIL__PORT: 1025
      AUTHENTIK_EMAIL__USE_TLS: 'false'
      AUTHENTIK_EMAIL__USE_SSL: 'false'
      AUTHENTIK_EMAIL__FROM: care@localhost
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-care-local-client-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - '9000:9000'
    volumes:
      - ./infra/authentik/blueprints:/blueprints/custom:ro
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.3
    command: worker
    environment:
      <<: *authentik-environment
      AUTHENTIK_E2E_API_TOKEN: ${AUTHENTIK_E2E_API_TOKEN:-care-e2e-local-api-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./infra/authentik/blueprints:/blueprints/custom:ro
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.port=8333
    ports:
      - '9002:8333'
      - '9004:8888'
    volumes:
      - care-seaweedfs:/data
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    restart: unless-stopped

  seaweedfs-init:
    image: amazon/aws-cli:2.33.1
    profiles: [bootstrap]
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - >-
        until aws s3api list-buckets --endpoint-url "$${S3_ENDPOINT}" >/dev/null 2>&1; do sleep 1; done;
        if ! aws s3api head-bucket --bucket "$${S3_BUCKET}" --endpoint-url "$${S3_ENDPOINT}" >/dev/null 2>&1; then
          aws s3api create-bucket --bucket "$${S3_BUCKET}" --endpoint-url "$${S3_ENDPOINT}";
        fi
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-care-s3}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-care-s3-dev-only}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: 'true'
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-care-documents}
    depends_on:
      seaweedfs:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '${MAILPIT_SMTP_PORT:-1026}:1025'
      - '8025:8025'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: [--config=/etc/otelcol-contrib/config.yaml]
    ports:
      - '4317:4317'
      - '4318:4318'
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: [CMD, /otelcol-contrib, validate, --config=/etc/otelcol-contrib/config.yaml]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.15.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --web.enable-lifecycle]
    ports:
      - '9090:9090'
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - care-prometheus:/prometheus

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-care-grafana-dev-only}
    ports:
      - '3002:3000'
    volumes:
      - care-grafana:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  osrm:
    # Keep this digest in sync with scripts/routing.mjs, which uses the same
    # image for dataset preprocessing.
    image: ghcr.io/project-osrm/osrm-backend:v26.10.0-debian@sha256:55dbfd47d984c2cacd64e32901b4321c86b5ec761438e69aa053dc78698a786f
    profiles: [routing]
    command: [/bin/bash, /usr/local/bin/care-osrm-entrypoint]
    ports:
      - '127.0.0.1:${ROUTING_OSRM_PORT:-5000}:5000'
    volumes:
      - ./data/osrm:/data:ro
      - ./infra/osrm/entrypoint.sh:/usr/local/bin/care-osrm-entrypoint:ro
      - ./infra/osrm/healthcheck.sh:/usr/local/bin/care-osrm-healthcheck:ro
    healthcheck:
      test: [CMD, /bin/bash, /usr/local/bin/care-osrm-healthcheck]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    restart: unless-stopped

volumes:
  care-postgres:
  care-redis:
  care-seaweedfs:
  care-prometheus:
  care-grafana:

configs:
  seaweedfs-s3:
    content: |
      {
        "identities": [
          {
            "name": "care-local",
            "credentials": [{
              "accessKey": "${S3_ACCESS_KEY:-care-s3}",
              "secretKey": "${S3_SECRET_KEY:-care-s3-dev-only}"
            }],
            "actions": ["Admin", "Read", "List", "Tagging", "Write"]
          }
        ]
      }
