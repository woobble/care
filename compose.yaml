name: care-platform-dev

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: care_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-care_owner_dev_only}
      POSTGRES_DB: care
      CARE_APP_PASSWORD: ${CARE_APP_PASSWORD:-care_dev_only}
      CARE_WORKER_PASSWORD: ${CARE_WORKER_PASSWORD:-care_worker_dev_only}
    ports:
      - '5432:5432'
    volumes:
      - care-postgres:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc
          "SELECT 1 WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'care_app')
          AND EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'care_worker')
          AND EXISTS (SELECT 1 FROM pg_database WHERE datname = 'authentik')"
          | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports:
      - '6379:6379'
    volumes:
      - care-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.4@sha256:e7226ae116dac5aa0a5643803e735b010038f492c401e08e16b3bf1ac54c090c
    command: server
    environment: &authentik-environment
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-local-authentik-secret-replace-before-deployment}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: care_owner
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:-care_owner_dev_only}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_WEB__BASE_URL: ${AUTHENTIK_WEB__BASE_URL:-http://localhost:9000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:3000/api/auth/callback/authentik}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-local-admin-password-replace-before-deployment}
      AUTHENTIK_EMAIL__HOST: mailpit
      AUTHENTIK_EMAIL__PORT: 1025
      AUTHENTIK_EMAIL__USE_TLS: 'false'
      AUTHENTIK_EMAIL__USE_SSL: 'false'
      AUTHENTIK_EMAIL__FROM: care@localhost
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-care-local-client-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - '${AUTHENTIK_HOST_PORT:-9000}:9000'
    volumes:
      - ./infra/authentik/blueprints:/blueprints/custom:ro
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.4@sha256:e7226ae116dac5aa0a5643803e735b010038f492c401e08e16b3bf1ac54c090c
    command: worker
    environment:
      <<: *authentik-environment
      AUTHENTIK_E2E_API_TOKEN: ${AUTHENTIK_E2E_API_TOKEN:-care-e2e-local-api-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./infra/authentik/blueprints:/blueprints/custom:ro
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      - server
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.port=8333
    ports:
      - '${SEAWEEDFS_S3_HOST_PORT:-9002}:8333'
      - '${SEAWEEDFS_FILER_HOST_PORT:-9004}:8888'
    volumes:
      - care-seaweedfs:/data
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8333/status]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  seaweedfs-init:
    image: care-platform-aws-cli:2.37.4-al2023-patched
    build:
      context: .
      dockerfile: infra/aws-cli/Dockerfile
    profiles: [bootstrap]
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - >-
        until aws s3api list-buckets --endpoint-url "$${S3_ENDPOINT}" >/dev/null 2>&1; do sleep 1; done;
        if ! aws s3api head-bucket --bucket "$${S3_BUCKET}" --endpoint-url "$${S3_ENDPOINT}" >/dev/null 2>&1; then
          aws s3api create-bucket --bucket "$${S3_BUCKET}" --endpoint-url "$${S3_ENDPOINT}";
        fi
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-care-s3}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-care-s3-dev-only}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: 'true'
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-care-documents}
    depends_on:
      seaweedfs:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - '${MAILPIT_SMTP_PORT:-1026}:1025'
      - '8025:8025'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.1@sha256:1175b03003053962012f5a231f5567f66a3e8fdb960c7835c0e48f7aa1555806
    profiles: [observability]
    command: [--config=/etc/otelcol-contrib/config.yaml]
    ports:
      - '4317:4317'
      - '4318:4318'
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: [CMD, /otelcol-contrib, validate, --config=/etc/otelcol-contrib/config.yaml]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [observability]
    command: [--config.file=/etc/prometheus/prometheus.yml, --web.enable-lifecycle]
    ports:
      - '9090:9090'
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - care-prometheus:/prometheus

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-care-grafana-dev-only}
    ports:
      - '3002:3000'
    volumes:
      - care-grafana:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  osrm:
    # Dataset preprocessing uses the same OSRM release from its pinned upstream
    # image; the production override retains the official binary in a minimal
    # Distroless runtime with no Debian package manager or shell utilities.
    image: ghcr.io/project-osrm/osrm-backend:v26.10.0-debian@sha256:55dbfd47d984c2cacd64e32901b4321c86b5ec761438e69aa053dc78698a786f
    profiles: [routing]
    command: [/bin/bash, /usr/local/bin/care-osrm-entrypoint]
    ports:
      - '127.0.0.1:${ROUTING_OSRM_PORT:-5000}:5000'
    volumes:
      - ./data/osrm:/data:ro
      - ./infra/osrm/entrypoint.sh:/usr/local/bin/care-osrm-entrypoint:ro
      - ./infra/osrm/healthcheck.sh:/usr/local/bin/care-osrm-healthcheck:ro
    healthcheck:
      test: [CMD, /bin/bash, /usr/local/bin/care-osrm-healthcheck]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    restart: unless-stopped

volumes:
  care-postgres:
  care-redis:
  care-seaweedfs:
  care-prometheus:
  care-grafana:

configs:
  seaweedfs-s3:
    content: |
      {
        "identities": [
          {
            "name": "care-local",
            "credentials": [{
              "accessKey": "${S3_ACCESS_KEY:-care-s3}",
              "secretKey": "${S3_SECRET_KEY:-care-s3-dev-only}"
            }],
            "actions": ["Admin", "Read", "List", "Tagging", "Write"]
          }
        ]
      }
